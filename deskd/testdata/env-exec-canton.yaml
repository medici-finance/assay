# Negative fixture: development environments and valid access levels still
# cannot grant exec-admin-pod to a participant namespace. A single environment
# spanning the app and Canton namespaces would accidentally share that grant.
# The safe shape is two environments with separate access lists.
# Expect refusal naming exec-admin-pod, the namespace and namespace isolation.
cells:
  - name: assay
    repos:
      - example-org/toolkit
      - example-other/tracker
    streams_root: docs/streams
    loops:
      - role: review
        schedule: "*/10 * * * *"
        models: [deepseek-chat, glm-5.2]
        app: assay-reviewer-app
    silence_threshold: 48h
    notification_tiers:
      review: push
      question: badge
      notify: none
    environments:
      - name: tracker-dev
        kind: k8s
        tier: dev
        cluster: fixture-cluster
        namespaces: [example-dev-app, example-dev-canton]
        access: [read, exec-admin-pod]
        admin_pod: {namespace: example-dev-app, workload: deploy/example-admin}
        runner_pool: example-verify-tracker
