# Negative-path fixture for cellsvalidate (the service contract Verify row 3).
#
# MUTATION ROW. Everything here is valid EXCEPT one namespace: the cell tries
# to declare `example-prod-app` alongside its two synthetic development namespaces. This is
# the exact edit the dev-only validator exists to refuse — a one-word change
# in a config file that, unrefused, would put a verify pod's RBAC into the
# production app namespace.
#
# Expect: non-zero exit, and an error that names the offending namespace and
# the dev-only rule. Two independent rules reject it (the positive `-dev`
# segment requirement and the segment-anchored prod denylist); the first to
# fire is the one reported.
cells:
  - name: assay
    repos:
      - example-org/toolkit
      - example-other/tracker
    streams_root: docs/streams
    loops:
      - role: review
        schedule: "*/10 * * * *"
        models: [deepseek-chat, glm-5.2]
        app: assay-reviewer-app
    silence_threshold: 48h
    notification_tiers:
      review: push
      question: badge
      notify: none
    environments:
      - name: tracker-dev
        kind: k8s
        tier: dev
        cluster: fixture-cluster
        namespaces: [example-dev-app, example-dev-canton, example-prod-app]
        access: [read]
        admin_pod: {namespace: example-dev-app, workload: deploy/example-admin}
        runner_pool: example-verify-tracker
