          description: no viewer identity accompanied the request
        "403":
          description: '{error: "configured desk"} for a configured desk id, or the viewer is not the answerer on the session''s cell — or a cross-origin browser request (a Sec-Fetch-Site other than same-origin/none, or an Origin other than deskd''s own), refused before identity is read'
        "404":
          description: no such custom session
      security:
        - viewerToken:
            - read:user
      summary: close a custom terminal session — never a configured desk
      x-action: session
      x-authored-as: the person, on their per-request viewer identity (custody rule (b)); answerer tier on the desk's cell; no GitHub write
      x-kind: named-action
servers:
  - description: the deskd service (loopback in v1; off-loopback requires the viewer-App validation configured)
    url: /
