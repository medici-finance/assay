# docker compose definition for the five desks (desk-containers/05).
#
# One `docker compose run <desk-name>` gives the same interactive session, work volume and
# credential surface as `containers/desk-run.sh <desk-name>` (docs/docker.md). It follows the
# runtime credential contract in containers/secrets.md section 4.2: the App PEM mounted read-only
# at /run/secrets/assay/app.pem, the model environment from an env-file.
#
# The PEM secrets carry no uid, gid or mode. Outside swarm, Compose bind-mounts a file secret
# read-only and ignores those three keys (it warns that they are not supported), so the file
# inside the container keeps the host file's owner and mode. On a Linux host, make each PEM
# readable by the container's `desk` user (UID 999), for example owner or group 999 at 0400 or
# 0440, and never world-readable. Docker Desktop's file sharing handles this for you.
#
# Run one desk (interactive, removed on exit):
#   docker compose -f containers/compose.yaml run --rm worker-desk
# Or keep a standing session and attach to it:
#   docker compose -f containers/compose.yaml up -d worker-desk
#   docker compose -f containers/compose.yaml attach worker-desk
#
# Nothing in this file is a credential. The App PEM is a compose secret read from a host file at
# runtime, and the model environment comes from an operator-held env-file. Neither is committed;
# containers/desk.env.example names the variables with placeholder values only.
#
# Host inputs (all optional; the defaults match desk-run.sh):
#   DESK_VERSION             image tag for every desk (default: latest)
#   ASSAY_DESK_ENV_FILE      the model env-file (default: $XDG_CONFIG_HOME/assay/desk.env)
#   ASSAY_DESK_PEM_FILE_DIR  directory holding one <desk-name>.pem per desk
#                            (default: $XDG_CONFIG_HOME/assay, itself defaulting to $HOME/.config)
# An override set but empty is used as given, not replaced by the default, so Compose refuses
# it (env-file not found, or no PEM at the bind source) rather than starting a desk on a file
# you did not name.
name: assay-desks

x-desk-common: &desk-common
  stdin_open: true
  tty: true
  # The model variables of containers/secrets.md section 3, supplied at runtime from the operator's
  # env-file. Keep that file to model settings: it reaches every desk started on its default path.
  env_file:
    - ${ASSAY_DESK_ENV_FILE-${XDG_CONFIG_HOME:-${HOME}/.config}/assay/desk.env}

services:
  intake-desk:
    <<: *desk-common
    image: ghcr.io/medici-finance/assay/intake-desk:${DESK_VERSION:-latest}
    secrets:
      - source: intake-desk-pem
        target: /run/secrets/assay/app.pem
    volumes:
      - intake-desk-work:/work

  worker-desk:
    <<: *desk-common
    image: ghcr.io/medici-finance/assay/worker-desk:${DESK_VERSION:-latest}
    secrets:
      - source: worker-desk-pem
        target: /run/secrets/assay/app.pem
    volumes:
      - worker-desk-work:/work

  pr-review-desk:
    <<: *desk-common
    image: ghcr.io/medici-finance/assay/pr-review-desk:${DESK_VERSION:-latest}
    secrets:
      - source: pr-review-desk-pem
        target: /run/secrets/assay/app.pem
    volumes:
      - pr-review-desk-work:/work

  verify-desk:
    <<: *desk-common
    image: ghcr.io/medici-finance/assay/verify-desk:${DESK_VERSION:-latest}
    secrets:
      - source: verify-desk-pem
        target: /run/secrets/assay/app.pem
    volumes:
      - verify-desk-work:/work

  the-desk:
    <<: *desk-common
    image: ghcr.io/medici-finance/assay/the-desk:${DESK_VERSION:-latest}
    secrets:
      - source: the-desk-pem
        target: /run/secrets/assay/app.pem
    volumes:
      - the-desk-work:/work

# One App PEM per desk, each its own host file (docs/docker.md: the implementer, reviewer and
# verifier must never share a key). Supplied by the operator, never committed. Mounted as the
# host file is (see the header): its owner and mode on the host decide whether UID 999 can read it.
secrets:
  intake-desk-pem:
    file: ${ASSAY_DESK_PEM_FILE_DIR-${XDG_CONFIG_HOME:-${HOME}/.config}/assay}/intake-desk.pem
  worker-desk-pem:
    file: ${ASSAY_DESK_PEM_FILE_DIR-${XDG_CONFIG_HOME:-${HOME}/.config}/assay}/worker-desk.pem
  pr-review-desk-pem:
    file: ${ASSAY_DESK_PEM_FILE_DIR-${XDG_CONFIG_HOME:-${HOME}/.config}/assay}/pr-review-desk.pem
  verify-desk-pem:
    file: ${ASSAY_DESK_PEM_FILE_DIR-${XDG_CONFIG_HOME:-${HOME}/.config}/assay}/verify-desk.pem
  the-desk-pem:
    file: ${ASSAY_DESK_PEM_FILE_DIR-${XDG_CONFIG_HOME:-${HOME}/.config}/assay}/the-desk.pem

# Named exactly as desk-run.sh names them, so a desk started by either surface sees the same /work.
# One volume per desk, never shared across desks.
volumes:
  intake-desk-work:
    name: intake-desk-work
  worker-desk-work:
    name: worker-desk-work
  pr-review-desk-work:
    name: pr-review-desk-work
  verify-desk-work:
    name: verify-desk-work
  the-desk-work:
    name: the-desk-work
