apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker-desk
  namespace: assay-desks
spec:
  replicas: 1
  # Stable Pod/PVC names only; no Service is needed for terminal attachment.
  serviceName: worker-desk
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-desk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-desk
        app.kubernetes.io/part-of: assay-desks
        assay.dev/profile: compatibility
    spec:
      serviceAccountName: desk-compat
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-desk
          # Recorded by its release build: ../release-images.json (check.sh binds it).
          image: ghcr.io/medici-finance/assay/worker-desk:v1.0.52@sha256:25f7be893ff5d3135cbea26cbfb9d1a0fcb356e92397f42030f9d9bbf4fcd6c5
          imagePullPolicy: IfNotPresent
          stdin: true
          stdinOnce: false
          tty: true
          env:
            - name: ASSAY_DESK
              value: worker-desk
            - name: ASSAY_APP_PEM_FILE
              value: /run/secrets/assay/app.pem
          envFrom:
            - secretRef:
                name: worker-desk-model
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: app-pem
              mountPath: /run/secrets/assay
              readOnly: true
      volumes:
        - name: app-pem
          secret:
            secretName: worker-desk-app-pem
            defaultMode: 0440
            items:
              - key: app.pem
                path: app.pem
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
