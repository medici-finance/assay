{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "the-desk",
    "namespace": "assay-desks"
  },
  "spec": {
    "replicas": 0,
    "template": {
      "metadata": {
        "labels": {
          "assay.dev/profile": "compatibility-cellctl"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "the-desk",
            "image": "ghcr.io/medici-finance/assay/the-desk:v1.0.65@sha256:0be637845b9f57163d1031fccf03c7da2f690b034f6cd5055fd484c54c7a804c",
            "args": [
              "/usr/local/bin/desk-session"
            ],
            "env": [
              {
                "name": "ASSAY_COMPAT_LAUNCH_ID",
                "value": "REQUIRES_PREPARED_LAUNCH_DIGEST"
              },
              {
                "name": "ASSAY_COMPAT_INIT_ID",
                "value": "REQUIRES_COLD_PREPARATION_ID"
              },
              {
                "name": "ASSAY_POD_UID",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.uid"
                  }
                }
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "/usr/local/bin/desk-session",
                  "--ready"
                ]
              },
              "periodSeconds": 2,
              "timeoutSeconds": 1,
              "failureThreshold": 1
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File"
          }
        ]
      }
    }
  }
}
