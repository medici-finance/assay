# .leakshape-allow.yaml — reviewed exceptions for the registry-independent SHAPE stage of the
# disclosure sweep (tools/desk/internal/deskkit/leakshape.go; issue #3159).
#
# Each entry permits the exact values it lists, of ONE shape, in ONE file:
#
#   path    exact repo-relative file (no directories, no globs)
#   shape   home-path | noreply-id-email | ssh-host-alias | tilde-root
#   sha256  the SHA-256 (64 lower-case hex digits) of each exact matched string this file
#           may carry (required, non-empty)
#   reason  why the value is a documented example, not a disclosure (required)
#
# Values are named by digest, never in the clear, so this file carries no shape itself and is
# swept like every other file. A failing gate prints each hit as path:line [shape]
# sha256:<digest> — the digest an entry needs. To check an entry against the file it names:
#   printf '%s' '<matched text>' | shasum -a 256
#
# A value an entry does not list still fails — in that file or in any other — so a real
# identity cannot ride in beside an example. An entry whose path or value no longer matches
# is STALE and fails TestS2ShapeRepoGate: delete it in the same change that removes the
# example. Adding an entry is a review decision; prefer a reserved example name (an
# .example / .invalid / .test host, a synthetic id) over a new exception.
#
# Shared reasons are YAML anchors (&name) reused by alias (*name).
allow:
