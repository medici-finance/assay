component: assay/harness-codex
version: 0.28.0
# The Codex harness adapter (§9): owns the .codex-plugin manifest and the
# generated AGENTS.md fragment (plugins/assay/codex/AGENTS-assay.md,
# `tools/harnessgen codex`) that an adopting repo installs at its own root
# AGENTS.md — Codex reads AGENTS.md natively
# (docs/streams/harness-portability/README.md). Files stay where they are;
# this manifest just names the ownership.
#
# Installed-shape evidence remains necessary. This source repository now carries
# several harness payloads; components/bindings.yaml selects its existing Claude
# declaration for lint. That selection does not configure a running harness.
provides:
  - key: assay.harness
    flavour: codex
    evidence: AGENTS.md
inject:
  required: []
  optional: []
apply:
  - id: plugin-manifest
    effect: install plugins/assay/.codex-plugin/plugin.json (tools/harnessgen codex)
    boundary: inside
    inverse: remove the installed plugins/assay/.codex-plugin/plugin.json
  - id: agents-fragment
    effect: install the generated plugins/assay/codex/AGENTS-assay.md fragment at the adopter's root AGENTS.md
    boundary: inside
    inverse: remove the installed AGENTS-assay.md fragment content from the adopter's root AGENTS.md
intercept: []
config: {}
