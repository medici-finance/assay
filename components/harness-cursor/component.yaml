component: assay/harness-cursor
version: 0.28.0
# The Cursor harness adapter (§9): owns the generated resident-rules Cursor
# rule (`tools/harnessgen cursor`, source at plugins/assay/cursor/assay.mdc)
# that an adopting repo installs as its always-apply `.cursor/rules` rule
# (docs/streams/harness-portability/README.md). Files stay where they are;
# this manifest just names the ownership; its apply step runs harnessgen.
#
# Installed-shape evidence remains necessary. This source repository now carries
# several harness payloads; components/bindings.yaml selects its existing Claude
# declaration for lint. That selection does not configure a running harness.
provides:
  - key: assay.harness
    flavour: cursor
    evidence: .cursor/rules
inject:
  required: []
  optional: []
apply:
  - id: cursor-rule
    effect: generate and install the Cursor always-apply rule at .cursor/rules (tools/harnessgen cursor, source plugins/assay/cursor/assay.mdc)
    boundary: inside
    inverse: remove the generated .cursor/rules rule (tools/harnessgen cursor output)
intercept: []
config: {}
