component: assay/reviewer-app
version: 0.28.0
# The separate review identity (the App whose review is a verdict). A human
# installs and grants it; the manifest declares the identity it provides so the
# review desk and shepherd can resolve it.
provides:
  - assay.reviewer-identity
inject:
  required:
    - key: assay.forge
    - key: assay.roster.trust
  optional: []
apply:
  - id: reviewer-binding
    effect: bind the reviewer App to the repo with its duty permission set
    boundary: outside
    ledger: app-installation
    compensation: list-for-human — gate:human, removing an App installation is human work; the ledger lists the installation to remove
intercept: []
config: {}
