component: assay/harness-claude-code
version: 0.28.0
# The Claude Code harness adapter (§9): owns the plugin manifest, the
# marketplace listing, and the SessionStart/PreToolUse hook wiring the hooks
# component injects assay.harness (flavour claude-code) to depend on. Files
# stay where they are; this manifest just names the ownership.
#
# Installed-shape evidence remains necessary. This source repository now carries
# several harness payloads; components/bindings.yaml selects its existing Claude
# declaration for lint. That selection does not configure a running harness.
provides:
  - key: assay.harness
    flavour: claude-code
    evidence: .claude-plugin/marketplace.json
inject:
  required: []
  optional: []
apply:
  - id: plugin-manifest
    effect: install plugins/assay/.claude-plugin/plugin.json and the root .claude-plugin/marketplace.json listing
    boundary: inside
    inverse: remove plugins/assay/.claude-plugin/plugin.json and the root .claude-plugin/marketplace.json listing
  - id: hook-wiring
    effect: wire plugins/assay/hooks/hooks.json (SessionStart) into the Claude Code plugin cache
    boundary: inside
    inverse: remove the wired plugins/assay/hooks/hooks.json entries from the Claude Code plugin cache
intercept: []
config: {}
