name: windows-ci-leg
# The WINDOWS CI LEG — windows-port/04. The first check in this repo to run on a
# Windows runner. Every other `runs-on:` is Linux (self-hosted medici-builder-public
# / medici-builder-release, plus one GitHub-hosted ubuntu-latest in inbound-triage);
# the Go toolchain there is hand-installed linux-amd64. Nothing has ever executed on
# Windows, so "statusgen runs on Windows" is a claim until this leg corroborates it.
#
# WHAT IT PROVES (Ian's direction, 2026-09-01):
#   (1) `statusgen --lint` exits 0 on Windows, and
#   (2) an OFFLINE desk-verb smoke passes on Windows.
# The smoke verb is `--version` — pure introspection (statusgen/main.go recognises
# `--version` as the SOLE argument and prints the build tag), no filesystem write, no
# forge/network, no POSIX shell-out. windows-port/02's portability triage classes the
# git/gh argv shell-outs `works` on Windows and names `--version`/`--help` as the safe
# offline smoke; a verb that contacts a live forge (deskpost / deskpr / gh PR create /
# gh issue create) or a POSIX-only surface is deliberately NOT used here.
#
# WHERE THIS RUNS — GitHub-hosted `windows-latest` (amd64). medici-finance/assay is
# PUBLIC, so windows-latest is free and needs no procurement; unlike the self-hosted
# Linux pool it reaches GitHub's release-asset CDN, so `actions/setup-go` works and the
# toolchain is not hand-installed. This is the amd64 substrate decision windows-port/04
# resolves; the native windows/arm64 smoke is a SEPARATE, held row (see below).
#
# WHAT THE LEG EXERCISES — an interim `go build` of statusgen from source on the Windows
# runner, then `--lint` + the `--version` smoke on that `statusgen.exe`. windows-port/03
# landed the release-binary install path (a Go-native `deskinstall` that resolves the
# pinned tag + per-platform sha256 from paired-versions.yaml and hash-verifies the
# `statusgen-windows-<arch>.exe` asset before placing it). The release-binary smoke —
# install via deskinstall, then `--lint`/`--version` on the INSTALLED `.exe` — is the
# follow-up form once a windows asset is published for the pinned tag; the from-source
# build here proves the Go/Windows code path works in the meantime and is the sanctioned
# interim per the brief. Both invoke the binary by its `.exe`-suffixed name.
#
# FAIL-FIRST (Task 5) — the green is load-bearing. Each assertion runs under
# `set -euo pipefail`, so a non-zero exit from statusgen reddens the job; statusgen
# itself exits non-zero on a broken input (a bogus verb → exit 2, a nonexistent lint
# root → exit 1, both measured on the host binary at implementation time). The
# `workflow_dispatch` input `failfirst`, when `true`, runs a step that points the smoke
# at a nonexistent verb and INVERTS the check — it fails the job unless statusgen
# refuses — so a maintainer can demonstrate on demand that the leg reddens rather than
# silently swallowing a failure. A `|| true`-style swallow or a smoke that runs nothing
# is exactly the vacuously-green design the brief rejects.
#
# NATIVE windows/arm64 smoke — held BLOCKED, never inferred from amd64. `windows-latest` is amd64. A NATIVE
# windows/arm64 smoke needs a `windows-11-arm` hosted runner or a self-hosted arm64
# Windows runner; this leg does NOT infer an arm64 result from the amd64 run. See the
# `arm64-native-smoke` job below — it is held BLOCKED with its reason and does no work.
# windows/arm64 still ships cross-compiled + checksummed from windows-port/01 regardless.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      failfirst:
        description: "Run the fail-first demonstration (points the smoke at a bogus verb; the leg MUST redden)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build statusgen.exe (interim from-source build)
        shell: bash
        run: |
          set -euo pipefail
          go version
          cd statusgen
          go build -o statusgen.exe .
          ./statusgen.exe --version

      - name: statusgen --lint (assert exit 0 on Windows)
        shell: bash
        run: |
          set -euo pipefail
          cd statusgen
          # --root is the REPO ROOT; statusgen resolves <root>/docs/streams under it,
          # so `--root ..` lints this repo's own stream tree. Exit 0 == clean.
          ./statusgen.exe --root .. --lint

      - name: Desk-verb smoke (offline; --version introspection)
        shell: bash
        run: |
          set -euo pipefail
          cd statusgen
          # Offline envelope: `--version` shells out to nothing and contacts no forge or
          # network. It is pure introspection — no mutating desk/forge verb runs here.
          out="$(./statusgen.exe --version)"
          echo "smoke: statusgen --version => ${out}"
          test -n "${out}"

      - name: Fail-first demonstration (opt-in; the leg MUST redden on a broken input)
        # `inputs.failfirst` is a real boolean (type: boolean) — use it directly; comparing it
        # to the string 'true' casts boolean→1 vs string→NaN (1 == NaN is false), which would
        # skip this step even when dispatched with failfirst=true. Falsy on push/pull_request
        # (no input present), so it stays dormant outside workflow_dispatch.
        if: ${{ inputs.failfirst }}
        shell: bash
        run: |
          set -uo pipefail
          cd statusgen
          # Point the smoke at a nonexistent verb and INVERT the assertion: statusgen must
          # refuse (non-zero). If it exits 0 the leg is not load-bearing — fail the job.
          if ./statusgen.exe --i-am-not-a-verb; then
            echo "::error::fail-first BROKEN — statusgen accepted a bogus verb; the green would be vacuous"
            exit 1
          fi
          echo "fail-first OK — statusgen refused the bogus verb (leg reddens on broken input as intended)"

  # windows-bootstrap-smoke: the ONLINE bootstrap hash-verify leg (windows-port/03, decision
  # #508). Kept SEPARATE from windows-smoke ON PURPOSE. windows-smoke is an OFFLINE envelope
  # (--lint / --version only, no live-forge contact — brief-04 row 4 asserts it), whereas
  # scripts/bootstrap-windows.ps1 downloads a release asset (Invoke-WebRequest to the GitHub
  # release CDN) to verify its sha256 at runtime. That live-forge download is the sanctioned
  # exception decision #508 requires; isolating it in this job keeps windows-smoke's offline
  # invariant intact rather than quietly widening it.
  windows-bootstrap-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap hash-verify at Windows runtime (tamper -> refuse; windows-port/03)
        shell: bash
        run: |
          set -euo pipefail
          # decision #508: exercise scripts/bootstrap-windows.ps1's sha256 hash-verify at Windows
          # runtime — a TAMPERED checksum must REFUSE (nothing installed), the pinned checksum must
          # install, and a check-removed copy must install the tampered asset (so the refusal is
          # non-vacuous). windows-port/06 moved tag+sha RESOLUTION into the script itself (it reads
          # plugins/assay/paired-versions.yaml directly), so this step passes only the tag — the
          # step passing is evidence the SCRIPT resolved the sha, because nothing else did here.
          # This step DOES contact the release CDN — the sanctioned online exception (decision
          # #508), which is exactly why it lives in this job and NOT in the offline windows-smoke.
          line=$(grep -E '^[[:space:]]*windows-amd64:[[:space:]]+statusgen-windows-amd64\.exe' plugins/assay/paired-versions.yaml | head -1)
          tag=$(echo "$line" | awk '{print $3}')
          echo "pinned windows-amd64: tag=${tag}"
          test -n "${tag}"
          pwsh -NoProfile -File scripts/windows-bootstrap-hashcheck-smoke.ps1 -Tag "${tag}"

      - name: Bootstrap PATH + bare-name invocation (windows-port/06 row 14)
        shell: bash
        run: |
          set -euo pipefail
          # The real (default -Dest) bootstrap run, with no operator-supplied sha — the
          # three-command-install target. A fresh process then reads the just-written user PATH
          # and invokes the installed binary by its bare name, proving row 5's PATH write and
          # row 14's bare-name invocation both hold, not just the scratch-dest smoke assertions.
          line=$(grep -E '^[[:space:]]*windows-amd64:[[:space:]]+statusgen-windows-amd64\.exe' plugins/assay/paired-versions.yaml | head -1)
          tag=$(echo "$line" | awk '{print $3}')
          test -n "${tag}"
          pwsh -NoProfile -File scripts/bootstrap-windows.ps1 -Tag "${tag}"
          userpath=$(pwsh -NoProfile -Command '[Environment]::GetEnvironmentVariable("Path","User")')
          PATH="${userpath};${PATH}" statusgen --version

  # native windows/arm64 smoke: BLOCKED — needs a windows-11-arm hosted runner (or a
  # self-hosted arm64 Windows runner). This leg does NOT green arm64 from the amd64
  # windows-latest result. Held with its reason per windows-port/04; unblocked when a
  # windows-11-arm runner is available to the repo. windows/arm64 ships cross-compiled +
  # checksummed from windows-port/01 regardless — this row is only the NATIVE smoke.
  arm64-native-smoke:
    # Intentionally never scheduled: `if: false` holds the row BLOCKED and does no work,
    # so it can never be mistaken for a passing arm64 result. Flip to a windows-11-arm
    # runner when one is available; do not derive its state from windows-smoke.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: BLOCKED — native windows/arm64 smoke awaits a windows-11-arm runner
        run: |
          echo "native windows/arm64 smoke is BLOCKED: no windows-11-arm runner available"
          exit 1

  # verify-in-container: windows-port/10 — the EXECUTION-WITNESS runner leg. It proves
  # `statusgen verifyrun --in-container` runs a real fixture Verify table THROUGH the
  # pinned harness container and the witness lands in Evidence, host-owned.
  #
  # RUNS ON ubuntu-latest, and that is deliberate, not a dodge of Windows. The harness
  # image is a LINUX image whichever host launches it; the Windows value is that a
  # Windows adopter USES this container BECAUSE a native pipefail `bash` is unreliable
  # there (#1418 — verifyrun records could-not-run, never a false fail, when no POSIX
  # shell bootstraps). The container path is identical on any host with a
  # Linux-container Docker backend, so ubuntu-latest — which has one — is the substrate
  # that can actually run it. The NATIVE-Windows-host proof (Docker Desktop on Windows
  # with its Linux-container backend) is the held `windows-verify-in-container` job
  # below; it is NEVER inferred from this ubuntu result.
  verify-in-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build statusgen
        shell: bash
        run: |
          set -euo pipefail
          cd statusgen
          go build -o "${RUNNER_TEMP}/statusgen" .

      - name: Fail-closed control — the wrapper REFUSES an un-digest-pinned image
        shell: bash
        run: |
          set -uo pipefail
          # The committed harness pin (plugins/assay/paired-versions.yaml `harness:`)
          # carries a PLACEHOLDER digest until a maintainer harvests the real registry
          # digest. The wrapper MUST refuse it — an un-digest-pinned image is never run.
          # Invert the assertion: the job FAILS unless the wrapper refuses. This step is
          # green the moment the leg is promoted; it does not wait on the digest harvest.
          if "${RUNNER_TEMP}/statusgen" verifyrun --in-container --root . \
               --brief docs/streams/windows-port/brief-10-verify-in-container.md; then
            echo "::error::the wrapper accepted an un-digest-pinned image — the fail-closed pin control is broken"
            exit 1
          fi
          echo "fail-closed OK — the wrapper refused the placeholder digest (an un-digest-pinned image is never run)"

      - name: Witness lands through the pinned container (live; runs once the real digest is pinned)
        shell: bash
        run: |
          set -euo pipefail
          # LIVE proof — apply-gated on the digest harvest, not fakeable here. It runs
          # ONLY when the committed harness digest is a real `sha256:<64hex>` (i.e. a
          # maintainer has harvested and pinned the published image's registry digest).
          # Until then it is skipped and reported, never greened from the control above.
          digest=$(grep -E '^[[:space:]]*digest:' plugins/assay/paired-versions.yaml | head -1 | awk '{print $2}')
          case "${digest}" in
            sha256:*)
              # A fixture brief with one trivial, offline Verify row; run it THROUGH the
              # container and assert the witness landed AND is owned by the runner user
              # (the --user host-ownership mapping), not root.
              fix="${RUNNER_TEMP}/fixture"
              mkdir -p "${fix}"
              cp -r plugins "${fix}/plugins"
              cp -r .git "${fix}/.git" 2>/dev/null || true
              cat > "${fix}/brief.md" <<'BRIEF'
          ## Verify
          | # | Command | Expect |
          |---|---------|--------|
          | 1 | `echo witness-lands` | output is `witness-lands` |

          ## Evidence
          BRIEF
              "${RUNNER_TEMP}/statusgen" verifyrun --in-container --root "${fix}" --brief "${fix}/brief.md"
              grep -q 'sha256:' "${fix}/brief.md" || { echo "::error::no witness row landed in Evidence"; exit 1; }
              owner=$(stat -c %u "${fix}/brief.md")
              test "${owner}" = "$(id -u)" || { echo "::error::witness file is owned by ${owner}, not the host user $(id -u) — the --user mapping did not apply"; exit 1; }
              echo "witness landed host-owned through the pinned container"
              ;;
            *)
              echo "held: the harness digest is a placeholder (${digest}); the live witness-lands proof runs once a maintainer harvests and pins the real registry digest. Not greened from the fail-closed control."
              ;;
          esac

  # windows-verify-in-container: the NATIVE-Windows-host proof — Docker Desktop on
  # Windows with its Linux-container backend runs the SAME wrapper. HELD BLOCKED
  # (`if: false`): GitHub-hosted `windows-latest` provides the Windows-container moby
  # engine only, with no Linux-container backend, so it cannot pull/run the Linux
  # harness image. This needs a Windows runner configured with Docker Desktop's
  # Linux-container backend (or a self-hosted equivalent). Held with its reason, never
  # inferred from the ubuntu `verify-in-container` result — the same "blocked is a
  # state, not a failure" contract the `arm64-native-smoke` row above uses. Flip it to
  # such a runner when one is available; the harness image itself is Linux regardless.
  windows-verify-in-container:
    if: false
    runs-on: windows-latest
    steps:
      - name: BLOCKED — native-Windows container run awaits a Linux-container Docker backend
        shell: bash
        run: |
          echo "native-Windows verify-in-container is BLOCKED: windows-latest has no Linux-container Docker backend to run the Linux harness image"
          exit 1
