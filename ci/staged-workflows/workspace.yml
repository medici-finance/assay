name: workspace
# The shared workspace contract module's own job: format, vet, its tests, and the
# mutation gate that proves the contract test turns red when a guarded rule is removed
# (spec/cell-workspaces-v1.md).
#
# The module is independent: its own go.mod, standard library only, no go.work at the
# repository root. ci.yml's build-test job already builds and vets it (it discovers every
# go.mod), and the desk suite runs its tests on every change through
# tools/desk/internal/regression (TestWorkspaceModuleSuite) — that is the always-on path,
# because the caller census reads the whole tree and must go red when a new checkout
# creator lands anywhere, not only under workspace/. This job adds the mutation gate,
# which ci.yml does not run.
#
# PATH TRIGGERS — the module, its spec, its schema, the census, and this file.
# GOWORK=off is set so a stray go.work can never widen it.
#
# WHERE THIS RUNS — the self-hosted `medici-builder-public` runner; Go is
# hand-installed from go.dev/dl exactly as ci.yml documents. The module has no
# third-party dependency; the mutation harness is built from tools/desk.
#
# ── STAGED, PENDING HUMAN PROMOTION ──
# No bot or App in this repo holds workflow-push permission, so this file is STAGED
# here and a maintainer PROMOTES it to .github/workflows/workspace.yml to activate it.
# Until promoted it runs nowhere. See ci/staged-workflows/README.md.

on:
  push:
    paths:
      - "workspace/**"
      - "spec/cell-workspaces-v1.md"
      - "schemas/cell-workspace-v1.json"
      - "docs/workspace-callers.md"
      - ".github/workflows/workspace.yml"
  pull_request:
    paths:
      - "workspace/**"
      - "spec/cell-workspaces-v1.md"
      - "schemas/cell-workspace-v1.json"
      - "docs/workspace-callers.md"
      - ".github/workflows/workspace.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.2"
  GOWORK: "off"

jobs:
  workspace:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: Format, vet, test
        working-directory: workspace
        run: |
          set -euo pipefail
          go version
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -timeout 120s ./...

      - name: Mutation gate
        run: |
          set -euo pipefail
          (cd tools/desk && go build -o "${RUNNER_TEMP}/muhar" ./cmd/muhar)
          cd workspace && "${RUNNER_TEMP}/muhar" -spec mutations.json
