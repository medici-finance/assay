name: release-images
# Called only by release.yml, after its build/test gates. Consumers never call
# an image build. The release stays unpublished until these references exist.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  images:
    runs-on: medici-builder-public-release
    concurrency:
      group: release-images-${{ inputs.version }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release-image-input
      - name: Restore the exact prepared source
        env:
          INPUT: ${{ runner.temp }}/release-image-input
          SOURCE: ${{ runner.temp }}/release-image-source
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE"
          (cd "$INPUT" && sha256sum -c build-inputs.sha256 && sha256sum -c checksums.txt)
          tar -xzf "$INPUT/prepared-source.tar.gz" -C "$SOURCE"
      - name: Build, verify and publish the release images
        env:
          RELEASE_TAG: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          VERIFY_RUNNER_IMAGE: ghcr.io/${{ github.repository_owner }}/verify-runner
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          INPUT: ${{ runner.temp }}/release-image-input
          SOURCE: ${{ runner.temp }}/release-image-source
          OUTPUT: ${{ runner.temp }}/release-image-refs
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          if [ "$DRY_RUN" != true ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          fi
          cd "$SOURCE"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.release.images import build_images
          build_images(Path.cwd(), os.environ['RELEASE_TAG'], os.environ['SOURCE_SHA'],
                       os.environ['REGISTRY_PREFIX'], os.environ['VERIFY_RUNNER_IMAGE'],
                       os.environ['INPUT'], os.environ['OUTPUT'], publish=os.environ['DRY_RUN'] != 'true')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.dry_run }}
        with:
          name: release-image-refs
          path: ${{ runner.temp }}/release-image-refs
          if-no-files-found: error
          retention-days: 7
