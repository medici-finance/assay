name: workflow PostgreSQL foundation
on:
  pull_request:
    paths:
      - "workflow/**"
      - "forgeread/go.mod"
      - "forgeread/mirror/**"
      - "forgeread/refresh/**"
      - "forgeread/**"
      - "tools/desk/**"
      - "spec/coordination-store-v1.md"
      - "docs/contracts.md"
      - "docs/go-engineering.md"
      - ".github/workflows/assay-workflow.yml"
      - "tools/desk/internal/deskkit/citrigger_test.go"
  push:
    branches: [main]
    paths:
      - "workflow/**"
      - "forgeread/go.mod"
      - "forgeread/mirror/**"
      - "forgeread/refresh/**"
      - "forgeread/**"
      - "tools/desk/**"
      - "spec/coordination-store-v1.md"
      - "docs/contracts.md"
      - "docs/go-engineering.md"
      - ".github/workflows/assay-workflow.yml"
      - "tools/desk/internal/deskkit/citrigger_test.go"
permissions:
  contents: read
jobs:
  test:
    runs-on: medici-builder-public
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: postgres
        ports: ["5432/tcp"]
        options: --health-cmd "pg_isready -U fixture_admin -d postgres" --health-interval 1s --health-timeout 2s --health-retries 30
    env:
      GOWORK: "off"
      KUBECONFIG: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        env:
          GO_VERSION: "1.27.3"
          GO_SHA256: "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          echo "${GO_SHA256}  ${RUNNER_TEMP}/go.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"
      - name: Qualify workflow against disposable PostgreSQL
        env:
          ASSAY_TEST_POSTGRES_DSN: postgresql://fixture_admin:fixture_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          cd workflow
          go vet ./...
          go test -count=1 -race -timeout=180s ./...
      - name: Qualify admitted persisted read-through
        env:
          ASSAY_TEST_POSTGRES_DSN: postgresql://fixture_admin:fixture_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
        run: |
          set -euo pipefail
          test -n "$ASSAY_TEST_POSTGRES_DSN"
          cd tools/desk
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          go test -count=1 -race -timeout=180s -v -run '^TestMirrorPersistedReadThroughJoin$' ./internal/deskkit > "$out"
          cat "$out"
          grep -F -- '--- PASS: TestMirrorPersistedReadThroughJoin ' "$out"
