name: ci
# Regular (non-Docker) build + test for every Go module in the tree.
#
# WHERE THIS RUNS — the self-hosted runner labelled `medici-builder-public`,
#   which has no Docker daemon. That is exactly right for `go build`/`go test`,
#   which need no container runtime. The Docker IMAGE build is a separate
#   workflow (docker-publish.yml) that runs release-only.
#
# GO TOOLCHAIN — installed by hand from go.dev/dl, NOT actions/setup-go: the
#   runner does not reach GitHub's release-asset CDN and its base image ships no
#   Go. go.dev/dl (→ dl.google.com) and the Go module proxy (proxy.golang.org)
#   are plain public HTTPS, so `go build`/`go test` fetch deps normally.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  build-test:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: Build and vet every module
        run: |
          set -euo pipefail
          go version
          # Discover each Go module (one go.mod per module) and compile + vet it
          # from its own root, so a new module is covered without editing this file.
          #
          # We `build` + `vet` rather than `go test` on purpose. This is a
          # PUBLISHED methodology tree; some tests under tools/desk are house-CI
          # STRUCTURAL guards (they assert on the source repo's .github/workflows,
          # go.work and sibling tool dirs — none of which exist here) and cannot
          # pass in a consumer checkout. `vet` compiles the test files too, so
          # this still catches compile breakage without running those dev-only
          # guards. Full `go test` returns once those structural tests are
          # withheld from the published tree.
          fail=0
          while IFS= read -r gomod; do
            dir="$(dirname "$gomod")"
            echo "::group::${dir}"
            if ( cd "$dir" && go build ./... && go vet ./... ); then
              echo "${dir}: OK"
            else
              echo "::error::${dir}: build/vet failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(git ls-files '*go.mod')
          exit "$fail"

  # The plugin SHELL suites. `assay-inbox.sh` / `inbound-monitor.sh` carry their
  # own regression suites (`*.test.sh`) but the build-test job above runs Go
  # build+vet only, so — exactly like the desk-tools controls that get their own
  # workflows — these suites passed locally and ran NOWHERE. This job runs them.
  #
  # HERMETIC by construction: each suite stubs `gh` / `statusgen` / `deskboard`
  # on PATH per case, so no token, no board, no historian and no network are
  # involved; a suite exits non-zero on the first failing case, which reddens
  # this job. New `plugins/assay/scripts/*.test.sh` files are picked up without
  # editing this workflow.
  plugin-shell-suites:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every plugin shell suite
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r suite; do
            echo "::group::${suite}"
            if bash "$suite"; then
              echo "${suite}: OK"
            else
              echo "::error::${suite}: shell suite failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(git ls-files 'plugins/assay/scripts/*.test.sh')
          exit "$fail"

  # GATING house-value / skill-home / guardrail-parity lint. `make skillslint`
  # runs tools/skillslint over every *.md under plugins/ (widened from the skill
  # bodies to the whole plugin tree): frontmatter validity, no proper-name-shaped
  # token in a driver position (the neutral `human:<name>` token is the only
  # permitted form), and a byte-diff of every shared-guardrail copy against its
  # one declared source (.claude/guardrails/GUARDRAILS.md). Three-state:
  # could-not-check is a FAILURE, never a quiet pass — so a plugin tree the tool
  # cannot read reddens this job rather than passing silently.
  #
  # Needs the Go toolchain (`make skillslint` -> `go run .` in tools/skillslint),
  # installed by hand from go.dev/dl for the same reason build-test documents.
  skillslint:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: make skillslint
        run: |
          set -euo pipefail
          go version
          make skillslint
