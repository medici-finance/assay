name: ci
# Regular (non-Docker) build + test for every Go module in the tree.
#
# WHERE THIS RUNS — the self-hosted runner labelled `medici-builder-public`,
#   which has no Docker daemon. That is exactly right for `go build`/`go test`,
#   which need no container runtime. The Docker IMAGE build is a separate
#   workflow (docker-publish.yml) that runs release-only.
#
# GO TOOLCHAIN — installed by hand from go.dev/dl, NOT actions/setup-go: the
#   runner does not reach GitHub's release-asset CDN and its base image ships no
#   Go. go.dev/dl (→ dl.google.com) and the Go module proxy (proxy.golang.org)
#   are plain public HTTPS, so `go build`/`go test` fetch deps normally.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  desk-platform-compile:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: Compile desk platform code and test binaries
        run: |
          set -euo pipefail
          cd tools/desk
          GOOS=windows GOARCH=amd64 go vet ./...
          for p in $(go list ./...); do GOOS=windows GOARCH=amd64 go test -c -o /dev/null "$p" || exit 1; done
          GOOS=darwin GOARCH=arm64 go vet ./...

  build-test:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: Build and vet every module
        run: |
          set -euo pipefail
          go version
          # Discover each Go module (one go.mod per module) and compile + vet it
          # from its own root, so a new module is covered without editing this file.
          #
          # We `build` + `vet` rather than `go test` on purpose. This is a
          # PUBLISHED methodology tree; some tests under tools/desk are house-CI
          # STRUCTURAL guards (they assert on the source repo's .github/workflows,
          # go.work and sibling tool dirs — none of which exist here) and cannot
          # pass in a consumer checkout. `vet` compiles the test files too, so
          # this still catches compile breakage without running those dev-only
          # guards. Full `go test` returns once those structural tests are
          # withheld from the published tree.
          fail=0
          while IFS= read -r gomod; do
            dir="$(dirname "$gomod")"
            echo "::group::${dir}"
            # tools/desk also runs its full suite here: the release workflow's
            # desk-tools leg already runs `go test ./...` on this tree (the
            # structural-guard caveat above no longer applies to it), and two
            # guard tests went latent on main under build+vet alone (#547, #550).
            #
            # tools/harnessgen, tools/harnesslint and tools/plugindrift run their
            # suites here too (harness-portability/15). They are safe in THIS repo
            # for the reason the structural-guard caveat names: harnessgen's
            # real-tree checks (`--check --root ../..`) resolve because ci.yml runs
            # in the SOURCE repo, where plugins/assay/** is present; plugindrift
            # stubs `gh` on PATH per case and is hermetic; harnesslint's suite is
            # fixture-based under testdata/. Build+vet alone left harnessgen's
            # drift oracle latent — its committed-manifest and version-parity
            # checks are exactly what catches a skill added without regenerating
            # the Codex/Cursor/resident packaging, or a .codex-plugin version left
            # behind, and un-wired they let both land green.
            extra=true
            case "$dir" in
              */tools/desk|tools/desk) extra="go test ./..." ;;
              */tools/harnessgen|tools/harnessgen) extra="go test ./..." ;;
              */tools/harnesslint|tools/harnesslint) extra="go test ./..." ;;
              */tools/plugindrift|tools/plugindrift) extra="go test ./..." ;;
            esac
            if ( cd "$dir" && go build ./... && go vet ./... && eval "$extra" ); then
              echo "${dir}: OK"
            else
              echo "::error::${dir}: build/vet failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(git ls-files '*go.mod')
          exit "$fail"

  # The plugin SHELL suites. `assay-inbox.sh` / `inbound-monitor.sh` carry their
  # own regression suites (`*.test.sh`) but the build-test job above runs Go
  # build+vet only, so — exactly like the desk-tools controls that get their own
  # workflows — these suites passed locally and ran NOWHERE. This job runs them.
  #
  # HERMETIC by construction: each suite stubs `gh` / `statusgen` / `deskboard`
  # on PATH per case, so no token, no board, no historian and no network are
  # involved; a suite exits non-zero on the first failing case, which reddens
  # this job. New `plugins/assay/scripts/*.test.sh` files are picked up without
  # editing this workflow.
  plugin-shell-suites:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every plugin shell suite
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r suite; do
            echo "::group::${suite}"
            if bash "$suite"; then
              echo "${suite}: OK"
            else
              echo "::error::${suite}: shell suite failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(git ls-files 'plugins/assay/scripts/*.test.sh')
          exit "$fail"

  # GATING house-value / skill-home / guardrail-parity lint. `tools/skillslint`
  # runs over every *.md under plugins/ (widened from the skill
  # bodies to the whole plugin tree): frontmatter validity, no proper-name-shaped
  # token in a driver position (the neutral `human:<name>` token is the only
  # permitted form), and a byte-diff of every shared-guardrail copy against its
  # one declared source (.claude/guardrails/GUARDRAILS.md). Three-state:
  # could-not-check is a FAILURE, never a quiet pass — so a plugin tree the tool
  # cannot read reddens this job rather than passing silently.
  #
  # Needs the Go toolchain (the tool is `go run .` in tools/skillslint; the runner
  # ships no `make`), installed by hand from go.dev/dl as build-test documents.
  skillslint:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: skillslint
        run: |
          set -euo pipefail
          go version
          # The `medici-builder-public` runner ships no `make`, so invoke the tool exactly
          # as the Makefile's `skillslint` target does: `cd tools/skillslint && go run .
          # --root ../..`. skillslint is authored in THIS tree (tools/skillslint), so running
          # it from its own source is the pinned invocation — there is no separately released
          # skillslint binary to fetch, and the Go toolchain is already installed above.
          cd tools/skillslint && go run . --root ../..

  # GATING harness-neutrality gate against the REAL bundle tree
  # (harness-portability/15). The build-test job now runs tools/harnesslint's own
  # suite, but that suite is FIXTURE-based (testdata/) — it proves the tool's
  # logic and reads nothing under plugins/assay. The neutrality property itself —
  # no banned harness token in a shipped skill body, every capability resolved
  # and every skill given a degradation cell in every binding reference — holds
  # only if the tool is pointed at the live tree, which is this job.
  #
  # Both invocations are EXPLICIT and named; deliberately not a `.assay-surfaces`
  # glob or any other discovery surface. Same shape as the skillslint job above:
  # the runner ships no `make`, so run the in-tree Go tool from its own source
  # with `../..`-relative arguments (the tool modules carry their own go.mod and
  # there is no root go.work).
  #
  # Three-state: harnesslint exits 0 checked-clean, 1 checked-failed, 2
  # could-not-check — and `set -euo pipefail` reddens the job on 1 AND on 2, so a
  # tree the tool cannot read is a failure here, never a quiet pass. A reference
  # file it skips by declaration is announced on stderr in the job log.
  harnesslint:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        run: |
          set -euo pipefail
          url="https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o "${RUNNER_TEMP}/go.tar.gz"
          mkdir -p "${HOME}/go-toolchain"
          tar -C "${HOME}/go-toolchain" -xzf "${RUNNER_TEMP}/go.tar.gz"
          echo "${HOME}/go-toolchain/go/bin" >> "${GITHUB_PATH}"

      - name: harnesslint bodies + bindings (real tree)
        run: |
          set -euo pipefail
          go version
          cd tools/harnesslint
          go run . --vocab ../../docs/streams/harness-portability/README.md \
            bodies ../../plugins/assay/skills
          go run . --vocab ../../docs/streams/harness-portability/README.md \
            bindings ../../plugins/assay/references
