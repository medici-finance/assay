name: docker-publish
# Build ONE combined Linux image (desk-tools suite + statusgen) and publish it
# to GHCR. See ../../Dockerfile for what's inside.
#
# WHERE THIS RUNS — release-only, on the self-hosted runner labelled
#   `medici-builder-public-release`, which provides a Docker daemon (DOCKER_HOST
#   is set), so it builds with plain `docker build` — no buildx, no Kaniko. That
#   label is kept safe by SEGMENTATION: only this workflow names it, and this
#   workflow fires ONLY on tag-push + manual dispatch — never on pull_request —
#   so a fork PR can never land a job on the build runner. The regular per-PR
#   build/test runs on ci.yml.
#
# ARCH — linux/amd64 only (single-arch; plain `docker build` on the runner arch).
#
# TWO WAYS IN
#   push a tag        desk-tools/v* — the tag's version becomes the image tag.
#   workflow_dispatch name a version; set dry_run to build WITHOUT pushing.

on:
  push:
    tags: ["desk-tools/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0 (the desk-tools/ tag prefix is not required here)."
        required: true
        type: string
      dry_run:
        description: "Build the image but do NOT push to GHCR."
        required: false
        default: false
        type: boolean

# Least privilege: read the source, write packages (GHCR).
permissions:
  contents: read
  packages: write

# One build per version at a time; never cancel a publish mid-flight.
concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # ghcr.io/medici-finance/assay/desk-tools — the recognised suite name;
  # statusgen ships in the same image (see the Dockerfile header).
  IMAGE: ghcr.io/${{ github.repository }}/desk-tools

jobs:
  build:
    runs-on: medici-builder-public-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resolve the version string once, from whichever trigger fired.
      #   tag push  -> strip the "desk-tools/" prefix off github.ref_name
      #   dispatch  -> the typed input, normalised to a leading "v"
      # Also decide push vs build-only: a dry-run dispatch builds without pushing.
      - name: Resolve version and publish mode
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
            case "$v" in v*) ;; *) v="v$v" ;; esac
            if [ "$DRY_RUN" = "true" ]; then push=false; else push=true; fi
          else
            # tag push: github.ref_name is "desk-tools/vX.Y.Z"
            v="${REF_NAME#desk-tools/}"
            push=true
          fi
          if ! printf '%s' "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve a vMAJOR.MINOR.PATCH version (got '$v')"
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          {
            echo "version=$v"
            echo "push=$push"
            echo "built_at=$(date -u +%FT%TZ)"
            echo "version_tag=${IMAGE}:${v}"
            echo "latest_tag=${IMAGE}:latest"
            echo "sha_tag=${IMAGE}:sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "version=$v push=$push (event=$EVENT)"

      # Log in only when we intend to push. A dry run never touches the registry.
      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Plain `docker build` against the runner's Docker daemon (DOCKER_HOST is
      # set). Single-arch (runner arch = linux/amd64). Version stamps go in via
      # build-args so the image's --version matches the tag.
      - name: Build
        env:
          VERSION_TAG: ${{ steps.cfg.outputs.version_tag }}
          LATEST_TAG: ${{ steps.cfg.outputs.latest_tag }}
          SHA_TAG: ${{ steps.cfg.outputs.sha_tag }}
          VERSION: ${{ steps.cfg.outputs.version }}
          BUILT_AT: ${{ steps.cfg.outputs.built_at }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --build-arg "BUILT_AT=${BUILT_AT}" \
            -t "$VERSION_TAG" \
            -t "$LATEST_TAG" \
            -t "$SHA_TAG" \
            -f ./Dockerfile \
            .

      - name: Push
        if: steps.cfg.outputs.push == 'true'
        env:
          VERSION_TAG: ${{ steps.cfg.outputs.version_tag }}
          LATEST_TAG: ${{ steps.cfg.outputs.latest_tag }}
          SHA_TAG: ${{ steps.cfg.outputs.sha_tag }}
        run: |
          set -euo pipefail
          docker push "$VERSION_TAG"
          docker push "$LATEST_TAG"
          docker push "$SHA_TAG"

      # GHCR packages are created PRIVATE on first push. Best-effort flip to
      # PUBLIC so the image pulls anonymously. The default GITHUB_TOKEN usually
      # lacks org package-admin; a failure here is EXPECTED and non-fatal — an
      # org owner then flips visibility once by hand in the package settings.
      - name: Make package public (best-effort)
        if: steps.cfg.outputs.push == 'true'
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GHCR_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/medici-finance/packages/container/assay%2Fdesk-tools \
            -d '{"visibility":"public"}')"
          echo "visibility PATCH -> HTTP $code"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::could not set desk-tools package visibility to public (HTTP $code); an org owner must flip it in GHCR package settings."
          fi
