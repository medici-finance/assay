name: docker-publish
# Build ONE combined multi-arch Linux image (desk-tools suite + statusgen) and
# publish it to GHCR. See ../../Dockerfile for what's inside.
#
# TWO WAYS IN
#   push a tag        desk-tools/v* — the same tag scheme release-desk.yml uses
#                     in the dev repo. The tag's version becomes the image tag.
#   workflow_dispatch name a version in the Actions UI; set dry_run to build
#                     both arches WITHOUT pushing (validation only).
#
# The image is Linux-only and multi-arch (linux/amd64 + linux/arm64). Native
# macOS / Windows binaries are a separate artifact and are not built here.

on:
  push:
    tags: ["desk-tools/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.1.0 (the desk-tools/ tag prefix is not required here)."
        required: true
        type: string
      dry_run:
        description: "Build both arches but do NOT push to GHCR."
        required: false
        default: false
        type: boolean

# Only what publishing needs: read the source, write packages (GHCR).
permissions:
  contents: read
  packages: write

# One build per version at a time; never cancel a publish mid-flight.
concurrency:
  group: docker-publish-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # ghcr.io/medici-finance/assay/desk-tools — the recognised suite name;
  # statusgen ships in the same image (see the Dockerfile header).
  IMAGE: ghcr.io/${{ github.repository }}/desk-tools

jobs:
  build:
    # medici-builder-public: the org's self-hosted runner label for PUBLIC repos
    # (canton-k8s uses the same). The private-repo label is `medici-builder`.
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@v4

      # Resolve the version string once, from whichever trigger fired.
      #   tag push  -> strip the "desk-tools/" prefix off github.ref_name
      #   dispatch  -> the typed input, normalised to a leading "v"
      # Also decide push vs build-only here: a dry-run dispatch, or any run that
      # is not a desk-tools/v* tag push, builds but does not publish.
      - name: Resolve version and publish mode
        id: cfg
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            v="$INPUT_VERSION"
            case "$v" in v*) ;; *) v="v$v" ;; esac
            if [ "$DRY_RUN" = "true" ]; then push=false; else push=true; fi
          else
            # tag push: github.ref_name is "desk-tools/vX.Y.Z"
            v="${REF_NAME#desk-tools/}"
            push=true
          fi
          if ! printf '%s' "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve a vMAJOR.MINOR.PATCH version (got '$v')"
            exit 1
          fi
          {
            echo "version=$v"
            echo "push=$push"
            echo "built_at=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"
          echo "version=$v push=$push (event=$EVENT)"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Log in only when we intend to push. A dry run / build-only never touches
      # the registry, so it does not need — or get — a login.
      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: :<version>, :latest and :sha-<short-sha>. metadata-action keeps the
      # tag/label set declarative.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version stamps into the image so its --version output matches the tag.
          build-args: |
            VERSION=${{ steps.cfg.outputs.version }}
            SOURCE_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.cfg.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
