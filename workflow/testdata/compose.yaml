# Explicit local Docker context and unique project name are operator inputs.
# This is a disposable synthetic-data fixture, never a deployment profile.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: fixture_admin
      POSTGRES_PASSWORD: fixture_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    volumes:
      - fixture_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixture_admin -d postgres"]
      interval: 1s
      timeout: 2s
      retries: 30
volumes:
  fixture_data: {}
