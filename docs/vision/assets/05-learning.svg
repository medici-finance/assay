<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" role="img" aria-labelledby="05-learning-title 05-learning-desc"><title id="05-learning-title">Evidence becomes the next governed decision</title><desc id="05-learning-desc">Observations are assessed, decisions authorize bounded delivery, and measurements inform the next observation.</desc><defs><marker id="05-learning-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#5d6470" stroke-width="1.5"/></marker></defs><rect width="1200" height="564" fill="white"/><text x="56" y="48" fill="#215ee8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">ASSAY / VISION</text><text x="56" y="100" fill="#171b21" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="400">Evidence becomes the next governed decision</text><text x="56" y="154" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Continuing practices retain the subject after a stream closes.</text><path d="M248,272 L280,272" stroke="#5d6470" stroke-width="2" fill="none" marker-end="url(#05-learning-arrow)"/><path d="M472,272 L504,272" stroke="#5d6470" stroke-width="2" fill="none" marker-end="url(#05-learning-arrow)"/><path d="M696,272 L728,272" stroke="#5d6470" stroke-width="2" fill="none" marker-end="url(#05-learning-arrow)"/><path d="M920,272 L952,272" stroke="#5d6470" stroke-width="2" fill="none" marker-end="url(#05-learning-arrow)"/><path d="M1048,328 V388 Q1048,396 1040,396 H160 Q152,396 152,388 V328" stroke="#5d6470" stroke-width="2" fill="none" marker-end="url(#05-learning-arrow)"/><rect x="56" y="216" width="192" height="112" rx="8" fill="#ffffff" stroke="#cfd4dc" stroke-width="1.5"/><text x="76" y="252" fill="#171b21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Observe</text><text x="72" y="280" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Record what happened</text><rect x="280" y="216" width="192" height="112" rx="8" fill="#ffffff" stroke="#cfd4dc" stroke-width="1.5"/><text x="300" y="252" fill="#171b21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Assess</text><text x="296" y="280" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Compare with intent</text><rect x="504" y="216" width="192" height="112" rx="8" fill="#ffffff" stroke="#215ee8" stroke-width="1.5"/><text x="524" y="252" fill="#215ee8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Decide</text><text x="520" y="280" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Use the proper authority</text><rect x="728" y="216" width="192" height="112" rx="8" fill="#ffffff" stroke="#cfd4dc" stroke-width="1.5"/><text x="748" y="252" fill="#171b21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Deliver</text><text x="744" y="280" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Make a bounded change</text><rect x="952" y="216" width="192" height="112" rx="8" fill="#ffffff" stroke="#cfd4dc" stroke-width="1.5"/><text x="972" y="252" fill="#171b21" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600">Measure</text><text x="968" y="280" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400">Record exposure + effect</text><text x="392" y="438" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Next decision returns through existing channels.</text><path d="M56,500 H1144" stroke="#cfd4dc"/><text x="56" y="532" fill="#5d6470" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Proposed operating cycle · delivery verification and outcome assessment remain distinct</text></svg>