# Fixture for the pattern-risk-input-missing-verdict rule — `risk-input` states
# only `low`/`standard`/`elevated` and omits `human`. `risk-input` MUST map every
# one of the four risk-class verdicts (spec/workflow-pattern-v1.md §4.2 rule 4).
# This MUST make `statusgen patterns --lint` exit 1, naming
# pattern-risk-input-missing-verdict.
schema: workflow-pattern-v1
pattern: bad-risk-input-missing-verdict
version: 1
risk-input:
  low: [review]
  standard: [review]
  elevated: [review]
nodes:
  - id: implement
    kind: artifact
    role: worker
    outputs: [branch]
  - id: review
    kind: check
    role: reviewer
    inputs:
      - {artifact: branch}
    outputs: [approval]
    evidence:
      - {kind: review, claim: "reviewer APPROVED", mandatory: true}
edges:
  - {from: implement, to: review}
join: review
