# A database branch the control plane has accepted a request for but whose
# create has not been issued yet: state requested, an empty effect list. A
# requested record stays representable — the contract's lifecycle starts here.
schema: runtime-resource-v1
id: rr-requested-01
class: database-branch
adapter:
  id: local-mock
  version: "1"
owner:
  brief: example/01
  run: run-0001
input-revision: 3f2a9c1
ttl: 4h
quota:
  - dimension: storage-mb
    limit: 512
  - dimension: compute-minutes
    limit: 60
data-classification: synthetic
provisioning:
  requested-by: agent:worker-1
  via: control-plane
credentials:
  durable-custody: control-plane
  agent-credential:
    scope: resource
    lifetime: 1h
  rotations: []
cleanup-owner: control-plane
evidence-kind: runtime-receipt
cost:
  amount: 0
  unit: USD
  basis: estimate
recovery: reconcile-before-retry
state: requested
effects: []
