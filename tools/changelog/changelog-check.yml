# ⚠️ STAGED — NOT YET ACTIVE. This file is the COMPLETE intended content of the
# changelog-check PR-gating workflow, staged here under tools/ because the
# identity that authored it cannot push under .github/workflows/ (a server-side
# workflows-scope block). A workflows-capable identity ACTIVATES this leg by
# copying this file verbatim (dropping this banner, down to the `# ---` rule) to
#     .github/workflows/changelog-check.yml
# (see tools/changelog/README.md — the "Workflows-scope activation prerequisite").
# Nothing reads it while it sits under tools/; the copy is the whole activation.
# ---------------------------------------------------------------------------
name: changelog-check
# A cheap PR gate for the FRAGMENT convention. A notable change records itself by
# adding ONE fragment file under `changelog/` (`changelog/<slug>.md`); a
# genuinely non-notable PR carries the `changelog:skip` label. This leg greens on
# EITHER, and — the whole point of the fragment rework — REFUSES a PR that edits
# `CHANGELOG.md`'s `## Unreleased` section directly. That shared section was a
# standing merge-conflict generator; it is retired, and CHANGELOG.md is now
# written only by the release workflow, which aggregates the fragments.
#
# CHEAP BY DESIGN — the decision is a diff read, not a semantic classifier. The
# whole decision lives in `tools/changelog/check.sh` (unit-tested offline by
# `tools/changelog/check_test.sh`); this workflow only feeds it the PR's base/head
# SHAs and the skip-label boolean, so the leg stays fast and its verdict legible:
# the fix for a red run is always one of two obvious acts — add a fragment, or
# label the PR.
#
# WHERE THIS RUNS — the self-hosted `medici-builder-public` runner, matching
# ci.yml and the other control legs. It needs no Go toolchain and no network: a
# git diff against the PR base, a label read off the event payload, and python3
# (present on the runner) for the shared changelog parser.

on:
  pull_request:
    # `labeled` / `unlabeled` are load-bearing: adding or removing the
    # `changelog:skip` label must re-run this leg so the verdict tracks the label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: medici-builder-public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so both PR-base and PR-head blobs of CHANGELOG.md (and
          # the changelog/ tree) resolve for the diff below (a shallow clone
          # would not carry them).
          fetch-depth: 0

      - name: Require a changelog fragment (or the changelog:skip label); refuse a direct Unreleased edit
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'changelog:skip') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/changelog/check.sh
