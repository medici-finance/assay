# freshness.yaml — periodic re-review manifest read by tools/freshness.
#
# tools/freshness ships as a tool; the manifest it reads is the adopter's own
# to write. This repo is also an adopter of its own tooling for the documents
# below, whose truth depends on code elsewhere rather than on anything the
# lint checks — exactly the class docs/iso9001-mapping.md's 7.5.1-7.5.2 row
# points at. Run `cd tools/freshness && go run . --root ..` to check it.

artifacts:
  - path: docs/records-and-retention.md
    last-reviewed: "2026-09-01"
    max-age-days: 45
    upstreams:
      - repo: .
        globs:
          - "statusgen/registers.go"
          - "statusgen/verifyrun.go"
          - "statusgen/witnessgate.go"
          - "statusgen/registerrefs.go"
          - "statusgen/viewlinks.go"
          - ".github/workflows/assay-statusgen.yml"
          - ".github/workflows/release.yml"
          - "docs/registers.md"
          - "docs/evidence-bundle.md"
          - "docs/telemetry.md"

  # Harness-portability capability matrices (harness-portability/01) and the
  # per-harness capability binding files (harness-portability/04/07). These
  # carry empirical vendor/harness behaviour — mechanism + degradation posture
  # per skill — so they rot on a clock rather than against tracked code, and
  # register with an empty upstreams list and a 45-day re-review leash.
  - path: docs/research/codex-harness-capabilities.md
    last-reviewed: "2026-08-08"
    max-age-days: 45
    upstreams: []

  - path: docs/research/cursor-harness-capabilities.md
    last-reviewed: "2026-08-26"
    max-age-days: 45
    upstreams: []

  # Harness-portability spikes (harness-portability/09 jcode, /10 SpecMem).
  # Empirical third-party harness/memory-layer facts with no locally-tracked
  # upstream clone, so they rot on a clock: empty upstreams, 45-day leash,
  # last-reviewed = the date the findings were authored.
  - path: docs/research/jcode-desk-harness-capabilities.md
    last-reviewed: "2026-08-24"
    max-age-days: 45
    upstreams: []

  - path: docs/research/specmem-portability-spike.md
    last-reviewed: "2026-08-24"
    max-age-days: 45
    upstreams: []
    # SpecMem upstream (SuperagenticAI/specmem) is not a locally-tracked clone,
    # so no upstream globs — the doc's documentary claims (adapter patterns,
    # MCP tool names, config keys) are re-verified against upstream on review,
    # and the live cross-harness run (§7 BLOCKED) is discharged separately.

  - path: plugins/assay/references/codex.md
    last-reviewed: "2026-08-24"
    max-age-days: 45
    upstreams: []

  - path: plugins/assay/references/claude-code.md
    last-reviewed: "2026-08-24"
    max-age-days: 45
    upstreams: []

  - path: plugins/assay/references/cursor.md
    last-reviewed: "2026-08-26"
    max-age-days: 45
    upstreams: []
