component: assay/hooks
version: 0.28.0
# The harness hook set: resident rules + board state injected at session boot,
# and the write guard on tool calls. Shaped for the bound harness.
provides:
  - assay.hooks.session-start
  - assay.hooks.pre-tool
inject:
  required: []
  optional:
    - key: assay.harness
    - key: assay.roster.ext.writeguard-callout
apply:
  - id: hook-wiring
    effect: install the session-start and pre-tool hooks into the harness hook config
    boundary: inside
    inverse: remove the hook wiring from the harness hook config
intercept:
  - assay.roster.ext.writeguard-callout
config: {}
