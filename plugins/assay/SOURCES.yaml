# ---------------------------------------------------------------------------
# Resident operating rules — single source + generated delivery artifacts
# (harness-portability/05, 2026-08-16).
#
# These are NOT skills (they do not match the coverage glob skills/*/SKILL.md),
# so plugindrift neither pins nor coverage-checks them; their provenance is
# recorded here so the manifest is not silent about them, and their in-sync
# guarantee is enforced by tools/harnessgen instead of by drift re-fetch:
#
#   plugins/assay/resident-rules.md
#     The SINGLE source of the ten resident operating rules (one `## R<N>`
#     section each). Authored in this repo; no upstream. HAND-EDIT THIS ONE.
#
#   plugins/assay/hooks/resident-rules.payload.txt   (GENERATED — do not edit)
#     The Claude Code SessionStart payload; inject-resident-rules.sh wraps it as
#     the {systemMessage: …} JSON. Byte-identical to the pre-refactor heredoc.
#
#   plugins/assay/codex/AGENTS-assay.md              (GENERATED — do not edit)
#     The Codex AGENTS.md fragment (HP/03 ruling A1: Codex CLI for v1), framed
#     as one `## ` section for AGENTS.md composition (HP/01 §3.1).
#
# Regenerate:  go run ./tools/harnessgen resident
# CI enforces: go run ./tools/harnessgen resident --check   (.github/workflows/tools.yml)
#   0 clean · 1 drift (source edited without regenerating, or an artifact
#   hand-edited) · 2 could-not-check (source missing/unparseable). The check
#   also runs in tools/harnessgen's unit suite (TestCommittedArtifactsMatchSource),
#   triggered on plugins/** and tools/** — see the cross-module-reader registry
#   row in tools/desk/internal/deskkit/citrigger_test.go.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Codex plugin manifest — generated from the single metadata source
# (harness-portability/06, 2026-08-22).
#
# Also NOT skills (they do not match skills/*/SKILL.md), so plugindrift neither
# pins nor coverage-checks them; their in-sync guarantee is enforced by
# tools/harnessgen instead:
#
#   plugins/assay/.claude-plugin/plugin.json
#     The Claude Code plugin manifest — ALSO the single METADATA source the Codex
#     manifest derives from (name, version, description, author, homepage,
#     repository, license, keywords). HAND-EDIT THIS ONE; the Codex manifest
#     follows. It cannot skew on version because it is generated, not hand-copied.
#
#   plugins/assay/.codex-plugin/plugin.json           (GENERATED — do not edit)
#     The Codex CLI plugin manifest (HP/01 §3.2 measured schema + superpowers
#     6.2.0 shape: a `skills: "./skills/"` directory pointer, not a per-skill
#     array). HP/03 A1: Codex CLI for v1 — the App-marketplace `interface` block
#     superpowers carries is deliberately omitted (App is HP/08, out of scope).
#
#   plugins/assay/codex/packaging.md
#     The coverage roster (the SOURCES.yaml discipline, ported): every
#     skills/*/SKILL.md must be listed packaged or excluded-with-reason; an
#     unaccounted skill is a hard error (exit 2). HAND-MAINTAIN when adding or
#     removing a skill. No exclusions today — every current skill runs/degrades/
#     refuses on Codex CLI, all of which ship (see references/codex.md).
#
# Regenerate:  go run ./tools/harnessgen codex
# CI enforces: tools/harnessgen's unit suite (TestCodexCommittedManifestMatchesSource
#   + the TestCodex* skew/coverage/binding tests) runs `codex --check` against the
#   repo root inside the harnessgen `go test` matrix leg (.github/workflows/tools.yml,
#   triggered on plugins/** and tools/**), so a version skew, a hand-edit, an
#   unaccounted skill, or a packaging↔binding skew reddens CI today.
#   0 clean · 1 drift (metadata source edited without regenerating, or the
#   manifest hand-edited/version-skewed) · 2 could-not-check (metadata source or
#   roster missing/unparseable; a skill on disk unaccounted-for in the roster;
#   or a packaged skill with no degradation cell in references/codex.md).
#   FOLLOW-UP: an explicit `codex --check` step in tools.yml (mirroring the
#   `resident --check` step) is desired belt-and-suspenders but edits a workflow
#   file, which the worker App cannot push (no `workflows` scope). It must be added
#   by a workflows-scoped identity; the unit suite already carries the guarantee.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# references: — provenance for the per-harness binding files (harness-portability/04).
#
# These are NOT skills, so they sit OUTSIDE plugindrift's `skills/*/SKILL.md`
# coverage universe by design (the pinned/canonical/unported lists above must
# equal the SKILL.md files on disk — a tested invariant). This section is
# documentation-only: plugindrift ignores the key, so it changes no coverage
# count. It is here so a reader of the manifest sees the WHOLE shipped tree, and
# so the bundle's provenance is complete.
#
# Their closure — every capability in the closed vocabulary resolves in every
# binding file, and every skill has a degradation cell in each — is a machine
# property held by `tools/harnesslint bindings`, wired into CI (tools.yml). That
# is the checker that keeps references/ coverage closed; plugindrift is not.
# ---------------------------------------------------------------------------
references:
  - path: references/claude-code.md
    reason: >-
      Authored in this repo (harness-portability/04) as the Claude Code capability
      binding: capability vocabulary → Claude mechanisms, all-`runs` degradation.
      No upstream. Closure held by `tools/harnesslint bindings`.
  - path: references/codex.md
    reason: >-
      Authored in this repo (harness-portability/04) as the Codex CLI capability
      binding, from HP/01's capability matrix and HP/03's degradation ruling.
      No upstream. Closure held by `tools/harnesslint bindings`.
