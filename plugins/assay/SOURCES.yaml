# SOURCES.yaml — machine-readable provenance for the bundled assay skills.
#
# PARITY.md is the human record: what was ported, what changed, and why.
# This file is the SAME provenance in a form a checker can read, so that
# "copy three has rotted" is something a command reports rather than
# something somebody has to remember to notice.
#
# Run:  make plugin-drift                      (advisory; always exit 0)
#       go run ./tools/plugindrift --fail-on-drift   (exit 1 on any drift)
#
# CANONICAL-HERE. Since the harness-portability/02 authority flip (2026-08-11)
# the five method-text skills are declared `canonical:` — the bundle IS their
# home. The port relationship that used to pin them to an upstream is over:
# there is no source to re-fetch, so nothing can report `behind`, `moved` or
# `unreachable`, and `--fail-on-drift` cannot trip. `notes:` carries the
# porting history in prose; the exact SHAs live in PARITY.md.
#
# `dailies` and `intake-desk` are NOT part of this flip — they were added by
# later, independent briefs (assay-selfcontain/10, education/04) after this
# flip's scope was set, and stay in `files:` with a real `source:` block,
# still measured for drift. Bringing them under a future flip is separate work.
#
# Coverage still applies: every `skills/*/SKILL.md` on disk must appear in
# `files:`, `canonical:` or `unported:` (a file in none of them is a hard
# error, exit 2, in both advisory and strict mode). A skill added to the
# bundle with no declaration cannot slip in unchecked.
#
# The checker reports one of:
#
#   in-sync      head blob == the recorded blob
#   behind       head blob differs; N commits have touched the path since
#   moved        the recorded path no longer exists at head
#   unreachable  the source could not be read (network, auth, or not a remote)
#
# `unreachable` is NEVER reported as `in-sync`. A source the checker cannot
# read is an unknown, not a pass. The five flipped skills below carry no
# source, so nothing is checked for them and the coverage line is the whole
# signal; `dailies` and `intake-desk` under `files:` are still checked.

version: 1
bundle: plugins/assay
bundle-version: "0.3.0"

files: []
