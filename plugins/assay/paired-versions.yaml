# plugin↔statusgen version-compat manifest
#
# The `assay:install` skill resolves the statusgen binary it installs FROM this file, so an
# adopter on a given plugin version always gets the statusgen release that plugin was built and
# tested against — never a mismatched or floating tool.
#
# Resolution: plugin version (plugins/assay/.claude-plugin/plugin.json) -> paired statusgen tag
# (below) -> pinned, sha256-verified `gh release download` of that tag from the release home.
#
# NEVER a floating/rolling tag. The tag is a plain repo-level semver tag; the per-platform
# sha256 is harvested from that PUBLISHED release's checksums.txt (a local build lacks the release
# -ldflags stamp and hashes differently), so it must never be hand-invented.
#
# On a plugin bump, re-pin (bump `statusgen.tag` and refresh every `sha256`) rather than editing a
# hash in place, so the upgrade shows in a diff. Keep `plugin` in step with plugin.json's version.
#
# GUARDED: `plugins/assay/scripts/check-paired-versions.sh` asserts, offline and in CI, that
# `plugin` below equals plugin.json's `version`, that every pinned tag is the SAME tag, and that
# every sha256 is 64 lowercase hex. Run it after any edit here — a re-pin that leaves the two
# files disagreeing is exactly the drift that shipped adopters a stale tool.

schema: paired-versions-v1

# LEFT side of the pairing: the plugin version this manifest is paired for.
# Must match plugins/assay/.claude-plugin/plugin.json `version`.
plugin: "0.5.1"

# RIGHT side: the statusgen release the plugin above is paired with.
statusgen:
  # Release home the umbrella statusgen binaries are published from (public).
  release_home: medici-finance/assay
  # Concrete, pinned repo-level semver tag. Never a floating/rolling ref.
  tag: v0.26.0
  # Per-platform channel-E pins: `<artifact> <tag> <sha256>`, the exact shape the adopter's
  # `.assay-versions` carries. sha256 values harvested from the v0.26.0 release checksums.txt.
  platforms:
    darwin-arm64: statusgen-darwin-arm64 v0.26.0 0c733d05a4604432275602eb992a076aab2c9526fa2b7b30f4723725c540850d
    darwin-amd64: statusgen-darwin-amd64 v0.26.0 1295b07f5e51924a0c66574520c4d0fc902523353261cc80c1f5d0f028acdbf2
    linux-amd64:  statusgen-linux-amd64  v0.26.0 127f8cd1ba46c671f7f8c429a921443cdfac40c424ca761191dd7c4d80841c55
    windows-amd64: statusgen-windows-amd64.exe v0.26.0 fa549fa1e19a0006ef109c61265aab397d528f7c69aa9181ee963a5f8d9b2f39
    windows-arm64: statusgen-windows-arm64.exe v0.26.0 9b01f839841742634377dd1b8c70e07503fe905ed32b14f3e19345c722f313c6
    # linux-arm64: no published statusgen-linux-arm64 asset in the v0.26.0 release yet.
    #   Left out deliberately rather than pinned to an invented hash; the install skill REFUSES
    #   (never guesses) when the pin line for a detected platform is absent.
    # The two windows arms above are no longer deferred: v0.26.0 is the first release to publish
    #   `statusgen-windows-{amd64,arm64}.exe`, so they are pinned from its checksums.txt like any
    #   other platform.

# The optional desk-role binaries (deskboard, deskpr, deskevidence, deskfile, deskpost, …), shipped
# from the SAME release as statusgen and acquired by the SAME channel-E, sha256-verified mechanism.
# Only needed if the adopter runs the automated desk pipeline; the `install-desk-tools` PRIMITIVE
# (docs/adopting-assay.md §3) resolves the tag + hash from here exactly as statusgen does.
desk-tools:
  # Same public release home the statusgen binaries are published from.
  release_home: medici-finance/assay
  # Pinned to the SAME tag as statusgen above — the desk binaries and statusgen are cut together.
  tag: v0.26.0
  # Per-platform channel-E pins: `<artifact> <tag> <sha256>`. The artifact is a `.tar.gz` (the
  # desk-tools ship as a tarball of binaries, not a single file). sha256 values harvested from the
  # v0.26.0 release checksums.txt — never hand-invented.
  platforms:
    darwin-arm64: desk-tools-darwin-arm64.tar.gz v0.26.0 70a2f3aaecca0ebf504e78792258033a190823820e64d03ee28086e987de891f
    darwin-amd64: desk-tools-darwin-amd64.tar.gz v0.26.0 7d97c69b847ee482ca13f9b7339ef8d7ec9a75fb19b8557fda7f821661fec53b
    linux-amd64:  desk-tools-linux-amd64.tar.gz  v0.26.0 17d9b8588f92b13a5dcf65307ac8d244320675f5e808469c2072df55823b23c9
    windows-amd64: desk-tools-windows-amd64.tar.gz v0.26.0 d4b97e802efa49aaab8fd6d1614049831480da49fdd91313ff66c75940a41f19
    windows-arm64: desk-tools-windows-arm64.tar.gz v0.26.0 00b557f20426d2381db6ada7dd513e57a0e8252f51c697c142fa0b145cccf3df
    # linux-arm64: no published desk-tools-linux-arm64 asset in the v0.26.0 release yet.
    #   Left out deliberately rather than pinned to an invented hash; the acquisition REFUSES
    #   (never guesses) when the pin line for a detected platform is absent — same as statusgen.
    # The two windows arms above mirror the statusgen ones: v0.26.0 is the first release to publish
    #   `desk-tools-windows-{amd64,arm64}.tar.gz`, so they are pinned rather than deferred.
