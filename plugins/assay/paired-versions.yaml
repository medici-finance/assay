# plugin↔statusgen version-compat manifest
#
# The `assay:install` skill resolves the statusgen binary it installs FROM this file, so an
# adopter on a given plugin version always gets the statusgen release that plugin was built and
# tested against — never a mismatched or floating tool.
#
# Resolution: plugin version (plugins/assay/.claude-plugin/plugin.json) -> paired statusgen tag
# (below) -> pinned, sha256-verified plain-HTTPS fetch of that tag from the release home
# (`scripts/assay-install.sh acquire` — no forge CLI; the digest compared is the pin, never a
# value fetched from the release home).
#
# NEVER a floating/rolling tag. The tag is a plain repo-level semver tag; the per-platform
# sha256 is harvested from that PUBLISHED release's checksums.txt (a local build lacks the release
# -ldflags stamp and hashes differently), so it must never be hand-invented.
#
# On a plugin bump, re-pin (bump `statusgen.tag` and refresh every `sha256`) rather than editing a
# hash in place, so the upgrade shows in a diff. Keep `plugin` in step with plugin.json's version.
#
# GUARDED: `plugins/assay/scripts/check-paired-versions.sh` asserts, offline and in CI, that
# `plugin` below equals plugin.json's `version`, that every pinned tag is the SAME tag, that
# every sha256 is 64 lowercase hex, and that containers/base/Dockerfile's `DESK_TOOLS_IMAGE`
# names the harness image@digest below. Run it after any edit here — a re-pin that leaves the
# files disagreeing is exactly the drift that shipped adopters a stale tool. Online,
# `tools/pairedversions` (`make paired-versions`) also checks every hash against the release's
# checksums.txt.

schema: paired-versions-v1

# LEFT side of the pairing: the plugin version this manifest is paired for.
# Must match plugins/assay/.claude-plugin/plugin.json `version`.
plugin: "1.0.65"

# RIGHT side: the statusgen release the plugin above is paired with.
statusgen:
  # Release home the umbrella statusgen binaries are published from (public).
  release_home: medici-finance/assay
  # Concrete, pinned repo-level semver tag. Never a floating/rolling ref.
  tag: v1.0.60
  # Per-platform channel-E pins: `<artifact> <tag> <sha256>`, the exact shape the adopter's
  # `.assay-versions` carries. sha256 values harvested from the v1.0.60 release checksums.txt.
  platforms:
    darwin-arm64: statusgen-darwin-arm64 v1.0.60 9266840ba81fa01b05a06e22af844952ce13f4afe8df8b5240579f3fc6fcfa46
    darwin-amd64: statusgen-darwin-amd64 v1.0.60 c33e37bf1cafa2b5d0b9b9f340a4054e5c21db241f9d682a65ad44608981e270
    linux-amd64:  statusgen-linux-amd64  v1.0.60 91b34d8fa00820605edbef12c3c3caba260194e64c8ac5f63d8a4326c57f0015
    windows-amd64: statusgen-windows-amd64.exe v1.0.60 1e1d976bc2dc40a2b692171e7690214c0b64c7cd0f5bb184bef5ecd8c97e3fa7
    windows-arm64: statusgen-windows-arm64.exe v1.0.60 2cccebb09dcc5718306a5c7f5ac5002249d98ffdf70f40fd36df60a8b22706a8
    # linux-arm64: no published statusgen-linux-arm64 asset in the v1.0.60 release either.
    #   Left out deliberately rather than pinned to an invented hash; the install skill REFUSES
    #   (never guesses) when the pin line for a detected platform is absent.
    # The two windows arms above are pinned like any other platform: `statusgen-windows-
    #   {amd64,arm64}.exe` have shipped in every release since v0.26.0, and v1.0.60 publishes both,
    #   so both hashes come from its checksums.txt.

# The optional desk-role binaries (deskboard, deskpr, deskevidence, deskfile, deskpost, …), shipped
# from the SAME release as statusgen and acquired by the SAME channel-E, sha256-verified mechanism.
# Only needed if the adopter runs the automated desk pipeline; the `install-desk-tools` PRIMITIVE
# (docs/adopting-assay.md §3) resolves the tag + hash from here exactly as statusgen does.
desk-tools:
  # Same public release home the statusgen binaries are published from.
  release_home: medici-finance/assay
  # Pinned to the SAME tag as statusgen above — the desk binaries and statusgen are cut together.
  tag: v1.0.60
  # Per-platform channel-E pins: `<artifact> <tag> <sha256>`. The artifact is a `.tar.gz` (the
  # desk-tools ship as a tarball of binaries, not a single file). sha256 values harvested from the
  # v1.0.60 release checksums.txt — never hand-invented.
  platforms:
    darwin-arm64: desk-tools-darwin-arm64.tar.gz v1.0.60 5188b9d71b0161ed79395e68393ef8a8d03cb93f66c7204ed4e99f3429f3216a
    darwin-amd64: desk-tools-darwin-amd64.tar.gz v1.0.60 1c5c550047a5cd9825752f4a91a85717ac265c80df07dd335b836891ecc1ff7e
    linux-amd64:  desk-tools-linux-amd64.tar.gz  v1.0.60 bf3cc1e55589a0edc81a3aa75eb2894e4e130eb892b3e741e666764c9f4d3ba1
    windows-amd64: desk-tools-windows-amd64.tar.gz v1.0.60 7c7c3269a70205bd4eef266cd753c5beee0c3d7a2a9722e6b43cbaf3f0b6eabb
    windows-arm64: desk-tools-windows-arm64.tar.gz v1.0.60 9e9c29b11144c8d24154293f852bd769632f6aedd3847ddc7b0d808a9e9bbe0c
    # linux-arm64: no published desk-tools-linux-arm64 asset in the v1.0.60 release either.
    #   Left out deliberately rather than pinned to an invented hash; the acquisition REFUSES
    #   (never guesses) when the pin line for a detected platform is absent — same as statusgen.
    # The two windows arms above mirror the statusgen ones: v1.0.60 publishes
    #   `desk-tools-windows-{amd64,arm64}.tar.gz`, so they are pinned rather than deferred.

# The HARNESS CONTAINER IMAGE — the witness-runner container `statusgen verifyrun --in-container`
# runs a brief's Verify rows inside (windows-port/10). It is the SAME combined desk-tools image the
# desk containers run (statusgen + the desk binaries ship in one Linux image; see docs/docker.md),
# published from the SAME release. On Windows a native pipefail `bash` is unreliable (#1418), so the
# supported execution-witness runner is this LINUX container, not a native shell — the host OS never
# executes the rows.
#
# PINNED BY TAG **AND DIGEST**, never `latest`. `statusgen verifyrun --in-container` resolves the
# image by its `digest` (`<image>@sha256:<64hex>`) and REFUSES fail-closed on a `latest` tag, an
# absent digest, or a placeholder — the same "never a floating ref, never a hand-invented hash"
# contract the per-platform pins above hold. The `tag` is kept for human/audit legibility; the
# digest is authoritative.
#
# The `digest` below is a REGISTRY digest, not a release `checksums.txt` sha256: it is the manifest
# digest of the desk-tools image in the published release-images.json, corroborated by the
# release's docker-publish output — never invented. On a re-pin, take the desk-tools reference
# from that release's checksum-verified metadata (not its distinct assay-harness image);
# a placeholder or `latest` here makes the wrapper REFUSE to run (fail-closed). The `tag` below is kept
# equal to the statusgen/desk-tools tag on purpose — `check-paired-versions.sh` asserts every `tag:` in
# this file is the one release tag.
harness:
  release_home: medici-finance/assay
  image: ghcr.io/medici-finance/assay/desk-tools
  tag: v1.0.60
  digest: sha256:33f9aab2bd116023b77c6c602fb03a42e5bc604e64bb5cca0ce2c9fd868dec1a
