component: assay/pdfingest
version: 0.28.0
# A utility skill: ingests PDFs for the research corpus. Self-contained — it reads
# local input and depends only on the harness it runs in.
provides:
  - assay.skill.pdfingest
inject:
  required:
    - key: assay.harness
  optional: []
apply:
  - id: skill-body
    effect: install the pdfingest skill directory into the harness plugin cache
    boundary: inside
    inverse: remove the skill directory from the harness plugin cache
intercept: []
config: {}
