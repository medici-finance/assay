component: assay/pr-review-desk
version: 0.28.0
# The PR-review-loop role skill: keeps the reviewer pool full and drives the
# fix-to-re-review-to-ready cycle. Reads the reviewer App's verdict.
provides:
  - assay.desk.role.pr-review-desk
inject:
  required:
    - key: assay.desk.verbs
      range: ">=0.20.0 <1.0.0"
    - key: assay.roster.trust
  optional:
    - key: assay.harness
    - key: assay.reviewer-identity
    - key: assay.roster.ext.risk-callout
apply:
  - id: skill-body
    effect: install the pr-review-desk skill directory into the harness plugin cache
    boundary: inside
    inverse: remove the skill directory (TODO composability/02 makes the reverse real)
intercept:
  - assay.roster.ext.risk-callout
config: {}
